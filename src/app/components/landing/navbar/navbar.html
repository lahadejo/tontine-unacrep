<!-- ========================================================= -->
<!-- NAVBAR UNACREP                                            -->
<!-- ========================================================= -->

<nav
  class="fixed top-0 left-0 right-0 z-50
         bg-white/95 backdrop-blur-md
         border-b border-gray-100
         shadow-sm"
>
  <!-- ======================================================= -->
  <!-- CONTENEUR PRINCIPAL                                     -->
  <!-- ======================================================= -->

  <div
    class="max-w-7xl mx-auto
           px-6 lg:px-8
           h-20
           flex items-center justify-between"
  >

    <!-- ===================================================== -->
    <!-- LOGO                                                   -->
    <!-- ===================================================== -->

    <a
      href="#accueil"
      class="flex items-center gap-3"
      (click)="closeMobileMenu()"
    >

      <img
        src="images/logo.png"
        alt="Logo UNACREP"
        class="h-12 w-auto object-contain"
      />

      <div class="hidden sm:block">

        <span class="block text-xl font-bold text-gray-900">
          UNACREP
        </span>

        <span class="block text-xs text-gray-500">
          Recouvrement & Tontines
        </span>

      </div>

    </a>


    <!-- ===================================================== -->
    <!-- MENU DESKTOP                                           -->
    <!-- ===================================================== -->

    <div class="hidden lg:flex items-center gap-8">

      <a
        href="#accueil"
        class="text-sm font-semibold text-green-700
               hover:text-green-800
               transition-colors duration-200"
      >
        Accueil
      </a>

      <a
        href="#solution"
        class="text-sm font-medium text-gray-600
               hover:text-green-700
               transition-colors duration-200"
      >
        La solution
      </a>

      <a
        href="#fonctionnalites"
        class="text-sm font-medium text-gray-600
               hover:text-green-700
               transition-colors duration-200"
      >
        Fonctionnalités
      </a>

      <a
        href="#fonctionnement"
        class="text-sm font-medium text-gray-600
               hover:text-green-700
               transition-colors duration-200"
      >
        Comment ça marche
      </a>

      <a
        href="#apropos"
        class="text-sm font-medium text-gray-600
               hover:text-green-700
               transition-colors duration-200"
      >
        À propos
      </a>

      <a
        href="#contact"
        class="text-sm font-medium text-gray-600
               hover:text-green-700
               transition-colors duration-200"
      >
        Contact
      </a>

    </div>


    <!-- ===================================================== -->
    <!-- ACTION DESKTOP                                         -->
    <!-- ===================================================== -->

    <div class="hidden lg:flex items-center gap-4">

      <a
       routerLink="/connexion"
        class="inline-flex items-center justify-center
               px-5 py-2.5
               rounded-xl
               bg-green-700
               text-white
               text-sm font-semibold
               shadow-md shadow-green-700/20
               hover:bg-green-800
               hover:-translate-y-0.5
               transition-all duration-200"
      >
        Se connecter
      </a>

    </div>


    <!-- ===================================================== -->
    <!-- BOUTON MENU MOBILE                                     -->
    <!-- ===================================================== -->

    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="lg:hidden
             inline-flex items-center justify-center
             w-11 h-11
             rounded-xl
             text-gray-700
             hover:bg-green-50
             hover:text-green-700
             transition-all duration-200"
      [attr.aria-label]="
        mobileMenuOpen
          ? 'Fermer le menu'
          : 'Ouvrir le menu'
      "
      [attr.aria-expanded]="mobileMenuOpen"
    >

      @if (mobileMenuOpen) {

        <!-- ICÔNE FERMER -->

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18 18 6M6 6l12 12"
          />
        </svg>

      } @else {

        <!-- ICÔNE MENU -->

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
          />
        </svg>

      }

    </button>

  </div>


  <!-- ======================================================= -->
  <!-- MENU MOBILE                                             -->
  <!-- ======================================================= -->

  @if (mobileMenuOpen) {

    <div
      class="lg:hidden
             border-t border-gray-100
             bg-white
             shadow-lg"
    >

      <div
        class="mx-auto max-w-7xl
               px-6 py-5 lg:px-8"
      >

        <!-- ================================================= -->
        <!-- NAVIGATION MOBILE                                 -->
        <!-- ================================================= -->

        <div class="flex flex-col gap-1">

          <!-- Accueil -->

          <a
            href="#accueil"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-semibold
                   text-green-700
                   bg-green-50
                   hover:bg-green-100
                   transition-colors duration-200"
          >
            Accueil
          </a>


          <!-- Solution -->

          <a
            href="#solution"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-medium
                   text-gray-600
                   hover:bg-green-50
                   hover:text-green-700
                   transition-colors duration-200"
          >
            La solution
          </a>


          <!-- Fonctionnalités -->

          <a
            href="#fonctionnalites"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-medium
                   text-gray-600
                   hover:bg-green-50
                   hover:text-green-700
                   transition-colors duration-200"
          >
            Fonctionnalités
          </a>


          <!-- Fonctionnement -->

          <a
            href="#fonctionnement"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-medium
                   text-gray-600
                   hover:bg-green-50
                   hover:text-green-700
                   transition-colors duration-200"
          >
            Comment ça marche
          </a>


          <!-- À propos -->

          <a
            href="#apropos"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-medium
                   text-gray-600
                   hover:bg-green-50
                   hover:text-green-700
                   transition-colors duration-200"
          >
            À propos
          </a>


          <!-- Contact -->

          <a
            href="#contact"
            (click)="closeMobileMenu()"
            class="rounded-xl px-4 py-3
                   text-sm font-medium
                   text-gray-600
                   hover:bg-green-50
                   hover:text-green-700
                   transition-colors duration-200"
          >
            Contact
          </a>

        </div>


        <!-- ================================================= -->
        <!-- SÉPARATEUR                                         -->
        <!-- ================================================= -->

        <div
          class="my-4
                 border-t border-gray-100"
        ></div>


        <!-- ================================================= -->
        <!-- CONNEXION                                          -->
        <!-- ================================================= -->

        <a
          routerLink="/connexion"
          (click)="closeMobileMenu()"
          class="flex items-center justify-center
                 rounded-xl
                 bg-green-700
                 px-5 py-3.5
                 text-sm font-semibold
                 text-white
                 shadow-md shadow-green-700/20
                 hover:bg-green-800
                 hover:-translate-y-0.5
                 transition-all duration-200"
        >
          Se connecter
        </a>

      </div>

    </div>

  }

</nav>


<!-- ========================================================= -->
<!-- ESPACE POUR LA NAVBAR                                     -->
<!-- ========================================================= -->

<div class="h-20"></div>
