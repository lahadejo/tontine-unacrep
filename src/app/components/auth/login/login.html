
<!-- ========================================================= -->
<!-- PAGE CONNEXION UNACREP                                    -->
<!-- ========================================================= -->

<section
  class="min-h-screen
         bg-gray-50
         flex items-center justify-center
         px-6 py-12"
>

  <!-- ======================================================= -->
  <!-- CONTENEUR                                               -->
  <!-- ======================================================= -->

  <div class="w-full max-w-md">

    <!-- ===================================================== -->
    <!-- LOGO                                                   -->
    <!-- ===================================================== -->

    <div class="mb-8 text-center">

      <a
        href="#accueil"
        class="inline-flex items-center justify-center"
      >

        <img
          src="images/logo.png"
          alt="Logo UNACREP"
          class="h-16 w-auto object-contain"
        />

      </a>

      <h1
        class="mt-5
               text-2xl
               font-extrabold
               tracking-tight
               text-gray-900"
      >
        Bienvenue sur UNACREP
      </h1>

      <p
        class="mt-2
               text-sm
               text-gray-500"
      >
        Connectez-vous à votre espace personnel
      </p>

    </div>


    <!-- ===================================================== -->
    <!-- CARTE CONNEXION                                        -->
    <!-- ===================================================== -->

    <div
      class="rounded-3xl
             border border-gray-100
             bg-white
             p-6
             shadow-xl shadow-gray-900/5
             sm:p-8"
    >

      <form
        (ngSubmit)="onSubmit()"
        #loginForm="ngForm"
      >

        <!-- ================================================= -->
        <!-- EMAIL                                               -->
        <!-- ================================================= -->

        <div>

          <label
            for="email"
            class="block
                   text-sm
                   font-semibold
                   text-gray-700"
          >
            Adresse e-mail
          </label>

          <div class="relative mt-2">

            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              autocomplete="email"
              placeholder="exemple@email.com"
              class="w-full
                     rounded-xl
                     border border-gray-200
                     bg-white
                     px-4 py-3
                     text-sm
                     text-gray-900
                     outline-none
                     transition-all duration-200
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />

          </div>

        </div>


        <!-- ================================================= -->
        <!-- MOT DE PASSE                                       -->
        <!-- ================================================= -->

        <div class="mt-5">

          <div class="flex items-center justify-between">

            <label
              for="password"
              class="block
                     text-sm
                     font-semibold
                     text-gray-700"
            >
              Mot de passe
            </label>

            <a
              routerLink="#mot-de-passe-oublie"
              class="text-xs
                     font-semibold
                     text-green-700
                     hover:text-green-800"
            >
              Mot de passe oublié ?
            </a>

          </div>


          <div class="relative mt-2">

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              class="w-full
                     rounded-xl
                     border border-gray-200
                     bg-white
                     px-4 py-3
                     pr-12
                     text-sm
                     text-gray-900
                     outline-none
                     transition-all duration-200
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />


            <!-- AFFICHER / MASQUER -->

            <button
              type="button"
              (click)="togglePassword()"
              class="absolute
                     right-3
                     top-1/2
                     -translate-y-1/2
                     flex
                     h-9 w-9
                     items-center justify-center
                     rounded-lg
                     text-gray-400
                     hover:bg-green-50
                     hover:text-green-700
                     transition-colors"
              [attr.aria-label]="
                showPassword
                  ? 'Masquer le mot de passe'
                  : 'Afficher le mot de passe'
              "
            >

              @if (showPassword) {

                <!-- œil fermé -->

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="h-5 w-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 3l18 18"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10.58 10.58a2 2 0 0 0 2.83 2.83"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9.88 5.09A10.72 10.72 0 0 1 12 4.88c5.1 0 8.5 5.12 8.5 5.12a17.36 17.36 0 0 1-2.2 2.77"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6.61 6.61C3.93 8.37 2.5 10 2.5 10s3.4 5.12 8.5 5.12c1.04 0 2-.17 2.86-.47"
                  />
                </svg>

              } @else {

                <!-- œil ouvert -->

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="h-5 w-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.5 12s3.4-5.12 9.5-5.12S21.5 12 21.5 12 18.1 17.12 12 17.12 2.5 12 2.5 12Z"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="2.5"
                  />
                </svg>

              }

            </button>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- SE SOUVENIR DE MOI                                -->
        <!-- ================================================= -->

        <div class="mt-5 flex items-center">

          <input
            id="rememberMe"
            name="rememberMe"
            type="checkbox"
            [(ngModel)]="rememberMe"
            class="h-4 w-4
                   rounded
                   border-gray-300
                   text-green-700
                   focus:ring-green-500"
          />

          <label
            for="rememberMe"
            class="ml-2
                   text-sm
                   text-gray-600"
          >
            Se souvenir de moi
          </label>

        </div>


        <!-- ================================================= -->
        <!-- BOUTON CONNEXION                                  -->
        <!-- ================================================= -->

        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="mt-6
                 w-full
                 rounded-xl
                 bg-green-700
                 px-5 py-3.5
                 text-sm
                 font-semibold
                 text-white
                 shadow-lg
                 shadow-green-700/20
                 transition-all duration-200
                 hover:bg-green-800
                 hover:-translate-y-0.5
                 disabled:cursor-not-allowed
                 disabled:opacity-50
                 disabled:hover:translate-y-0"
        >
          Se connecter
        </button>

      </form>


      <!-- ================================================= -->
      <!-- INSCRIPTION                                        -->
      <!-- ================================================= -->

      <div class="mt-7 text-center">

        <p class="text-sm text-gray-500">

          Vous n'avez pas encore de compte ?

          <a
            routerLink="/inscription"
            class="font-semibold
                   text-green-700
                   hover:text-green-800"
          >
            Créer un compte
          </a>

        </p>

      </div>

    </div>


    <!-- ===================================================== -->
    <!-- RETOUR                                                -->
    <!-- ===================================================== -->

    <div class="mt-6 text-center">

      <a
        href="#accueil"
        class="text-sm
               font-medium
               text-gray-500
               hover:text-green-700
               transition-colors"
      >
        ← Retour à l'accueil
      </a>

    </div>

  </div>

</section>
