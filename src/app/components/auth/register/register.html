
<!-- ========================================================= -->
<!-- PAGE INSCRIPTION UNACREP                                  -->
<!-- ========================================================= -->

<section
  class="min-h-screen
         bg-gray-50
         flex items-center justify-center
         px-6 py-12"
>

  <div class="w-full max-w-lg">

    <!-- ===================================================== -->
    <!-- LOGO                                                   -->
    <!-- ===================================================== -->

    <div class="mb-8 text-center">

      <a
        href="/"
        class="inline-flex items-center justify-center"
      >

        <img
          src="images/logo.png"
          alt="Logo UNACREP"
          class="h-16 w-auto object-contain"
        />

      </a>

      <h1
        class="mt-5
               text-2xl
               font-extrabold
               tracking-tight
               text-gray-900"
      >
        Créer votre compte
      </h1>

      <p
        class="mt-2
               text-sm
               text-gray-500"
      >
        Rejoignez UNACREP et gérez facilement vos opérations
      </p>

    </div>


    <!-- ===================================================== -->
    <!-- CARTE                                                  -->
    <!-- ===================================================== -->

    <div
      class="rounded-3xl
             border border-gray-100
             bg-white
             p-6
             shadow-xl shadow-gray-900/5
             sm:p-8"
    >

      <form
        #registerForm="ngForm"
        (ngSubmit)="onSubmit()"
      >

        <!-- ================================================= -->
        <!-- NOM / PRÉNOM                                       -->
        <!-- ================================================= -->

        <div class="grid gap-5 sm:grid-cols-2">

          <!-- Prénom -->

          <div>

            <label
              for="firstName"
              class="block
                     text-sm
                     font-semibold
                     text-gray-700"
            >
              Prénom
            </label>

            <input
              id="firstName"
              name="firstName"
              type="text"
              [(ngModel)]="firstName"
              required
              autocomplete="given-name"
              placeholder="Votre prénom"
              class="mt-2
                     w-full
                     rounded-xl
                     border border-gray-200
                     px-4 py-3
                     text-sm
                     outline-none
                     transition-all
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />

          </div>


          <!-- Nom -->

          <div>

            <label
              for="lastName"
              class="block
                     text-sm
                     font-semibold
                     text-gray-700"
            >
              Nom
            </label>

            <input
              id="lastName"
              name="lastName"
              type="text"
              [(ngModel)]="lastName"
              required
              autocomplete="family-name"
              placeholder="Votre nom"
              class="mt-2
                     w-full
                     rounded-xl
                     border border-gray-200
                     px-4 py-3
                     text-sm
                     outline-none
                     transition-all
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />

          </div>

        </div>


        <!-- ================================================= -->
        <!-- TÉLÉPHONE                                          -->
        <!-- ================================================= -->

        <div class="mt-5">

          <label
            for="phone"
            class="block
                   text-sm
                   font-semibold
                   text-gray-700"
          >
            Numéro de téléphone
          </label>

          <input
            id="phone"
            name="phone"
            type="tel"
            [(ngModel)]="phone"
            required
            autocomplete="tel"
            placeholder="+229 XX XX XX XX"
            class="mt-2
                   w-full
                   rounded-xl
                   border border-gray-200
                   px-4 py-3
                   text-sm
                   outline-none
                   transition-all
                   placeholder:text-gray-400
                   focus:border-green-500
                   focus:ring-4
                   focus:ring-green-500/10"
          />

        </div>


        <!-- ================================================= -->
        <!-- EMAIL                                               -->
        <!-- ================================================= -->

        <div class="mt-5">

          <label
            for="email"
            class="block
                   text-sm
                   font-semibold
                   text-gray-700"
          >
            Adresse e-mail
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            email
            autocomplete="email"
            placeholder="exemple@email.com"
            class="mt-2
                   w-full
                   rounded-xl
                   border border-gray-200
                   px-4 py-3
                   text-sm
                   outline-none
                   transition-all
                   placeholder:text-gray-400
                   focus:border-green-500
                   focus:ring-4
                   focus:ring-green-500/10"
          />

        </div>


        <!-- ================================================= -->
        <!-- MOT DE PASSE                                       -->
        <!-- ================================================= -->

        <div class="mt-5">

          <label
            for="password"
            class="block
                   text-sm
                   font-semibold
                   text-gray-700"
          >
            Mot de passe
          </label>

          <div class="relative mt-2">

            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              required
              minlength="8"
              autocomplete="new-password"
              placeholder="Minimum 8 caractères"
              class="w-full
                     rounded-xl
                     border border-gray-200
                     px-4 py-3
                     pr-12
                     text-sm
                     outline-none
                     transition-all
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />

            <button
              type="button"
              (click)="togglePassword()"
              class="absolute
                     right-3 top-1/2
                     -translate-y-1/2
                     flex h-9 w-9
                     items-center justify-center
                     rounded-lg
                     text-gray-400
                     hover:bg-green-50
                     hover:text-green-700"
            >
              @if (showPassword) {
                <span class="text-xs font-semibold">Masquer</span>
              } @else {
                <span class="text-xs font-semibold">Afficher</span>
              }
            </button>

          </div>

        </div>


        <!-- ================================================= -->
        <!-- CONFIRMATION                                       -->
        <!-- ================================================= -->

        <div class="mt-5">

          <label
            for="passwordConfirmation"
            class="block
                   text-sm
                   font-semibold
                   text-gray-700"
          >
            Confirmer le mot de passe
          </label>

          <div class="relative mt-2">

            <input
              id="passwordConfirmation"
              name="passwordConfirmation"
              [type]="
                showPasswordConfirmation
                  ? 'text'
                  : 'password'
              "
              [(ngModel)]="passwordConfirmation"
              required
              autocomplete="new-password"
              placeholder="Confirmez votre mot de passe"
              class="w-full
                     rounded-xl
                     border border-gray-200
                     px-4 py-3
                     pr-12
                     text-sm
                     outline-none
                     transition-all
                     placeholder:text-gray-400
                     focus:border-green-500
                     focus:ring-4
                     focus:ring-green-500/10"
            />

            <button
              type="button"
              (click)="togglePasswordConfirmation()"
              class="absolute
                     right-3 top-1/2
                     -translate-y-1/2
                     flex h-9 w-9
                     items-center justify-center
                     rounded-lg
                     text-gray-400
                     hover:bg-green-50
                     hover:text-green-700"
            >
              @if (showPasswordConfirmation) {
                <span class="text-xs font-semibold">Masquer</span>
              } @else {
                <span class="text-xs font-semibold">Afficher</span>
              }
            </button>

          </div>

          @if (
            passwordConfirmation &&
            password !== passwordConfirmation
          ) {
            <p class="mt-2 text-xs font-medium text-red-500">
              Les mots de passe ne correspondent pas.
            </p>
          }

        </div>


        <!-- ================================================= -->
        <!-- CONDITIONS                                         -->
        <!-- ================================================= -->

        <div class="mt-6 flex items-start gap-3">

          <input
            id="acceptTerms"
            name="acceptTerms"
            type="checkbox"
            [(ngModel)]="acceptTerms"
            required
            class="mt-0.5
                   h-4 w-4
                   rounded
                   border-gray-300
                   text-green-700
                   focus:ring-green-500"
          />

          <label
            for="acceptTerms"
            class="text-sm leading-6 text-gray-600"
          >
            J'accepte les
            <a
              href="#conditions"
              class="font-semibold
                     text-green-700
                     hover:text-green-800"
            >
              conditions d'utilisation
            </a>
            et la
            <a
              href="#confidentialite"
              class="font-semibold
                     text-green-700
                     hover:text-green-800"
            >
              politique de confidentialité
            </a>.
          </label>

        </div>


        <!-- ================================================= -->
        <!-- BOUTON                                             -->
        <!-- ================================================= -->

        <button
          type="submit"
          [disabled]="
            !registerForm.valid ||
            password !== passwordConfirmation
          "
          class="mt-6
                 w-full
                 rounded-xl
                 bg-green-700
                 px-5 py-3.5
                 text-sm
                 font-semibold
                 text-white
                 shadow-lg
                 shadow-green-700/20
                 transition-all duration-200
                 hover:bg-green-800
                 hover:-translate-y-0.5
                 disabled:cursor-not-allowed
                 disabled:opacity-50
                 disabled:hover:translate-y-0"
        >
          Créer mon compte
        </button>

      </form>


      <!-- ================================================= -->
      <!-- CONNEXION                                          -->
      <!-- ================================================= -->

      <div class="mt-7 text-center">

        <p class="text-sm text-gray-500">

          Vous avez déjà un compte ?

          <a
            href="/connexion"
            class="font-semibold
                   text-green-700
                   hover:text-green-800"
          >
            Se connecter
          </a>

        </p>

      </div>

    </div>


    <!-- ===================================================== -->
    <!-- RETOUR                                                -->
    <!-- ===================================================== -->

    <div class="mt-6 text-center">

      <a
        href="/"
        class="text-sm
               font-medium
               text-gray-500
               hover:text-green-700
               transition-colors"
      >
        ← Retour à l'accueil
      </a>

    </div>

  </div>

</section>
