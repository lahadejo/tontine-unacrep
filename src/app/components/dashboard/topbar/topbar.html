<header
  class="sticky top-0 z-30 flex h-20 items-center justify-between border-b border-gray-200 bg-white px-4 sm:px-6 lg:px-8"
>
  <!-- ===================================================== -->
  <!-- PARTIE GAUCHE -->
  <!-- ===================================================== -->

  <div class="flex items-center gap-4">

    <!-- Bouton menu mobile -->
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-xl text-gray-600 transition hover:bg-gray-100 lg:hidden"
      aria-label="Ouvrir le menu"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>


    <!-- Titre -->
    <div>
      <h2 class="text-lg font-bold text-gray-900">
        Tableau de bord
      </h2>

      <p class="hidden text-sm text-gray-500 sm:block">
        Bienvenue dans votre espace UNACREP
      </p>
    </div>

  </div>


  <!-- ===================================================== -->
  <!-- PARTIE DROITE -->
  <!-- ===================================================== -->

  <div class="flex items-center gap-3">

    <!-- ================================================= -->
    <!-- RECHERCHE -->
    <!-- ================================================= -->

    <div class="relative hidden md:block">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 21l-4.35-4.35m2.35-5.65a8 8 0 11-16 0 8 8 0 0116 0z"
        />
      </svg>

      <input
        type="search"
        placeholder="Rechercher..."
        class="h-10 w-56 rounded-xl border border-gray-200 bg-gray-50 pl-10 pr-4 text-sm text-gray-700 outline-none transition placeholder:text-gray-400 focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-100"
      />

    </div>


    <!-- ================================================= -->
    <!-- NOTIFICATIONS -->
    <!-- ================================================= -->

    <a
      routerLink="/dashboard/notifications"
      class="relative flex h-10 w-10 items-center justify-center rounded-xl text-gray-500 transition hover:bg-green-50 hover:text-green-600"
      aria-label="Notifications"
      title="Notifications"
    >

      <!-- Icône cloche -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 17h5l-1.5-1.5A2 2 0 0118 14v-3a6 6 0 00-12 0v3a2 2 0 01-.5 1.5L4 17h5m6 0a3 3 0 01-6 0"
        />
      </svg>

      <!-- Badge notification -->
      <span
        class="absolute right-2 top-2 h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"
      ></span>

    </a>


    <!-- Séparateur -->
    <div class="hidden h-8 w-px bg-gray-200 sm:block"></div>


    <!-- ================================================= -->
    <!-- PROFIL UTILISATEUR -->
    <!-- ================================================= -->

    <div
      class="relative"
      data-profile-menu
    >

      <!-- Bouton profil -->
      <button
        type="button"
        (click)="toggleMenuProfil()"
        class="flex items-center gap-3 rounded-xl p-1.5 transition hover:bg-gray-50"
        [attr.aria-expanded]="menuProfilOuvert"
        aria-haspopup="true"
      >

        <!-- Avatar -->
        <div
          class="flex h-10 w-10 items-center justify-center rounded-full bg-green-100 text-sm font-bold text-green-700"
        >
          {{ utilisateur.initiales }}
        </div>


        <!-- Informations utilisateur -->
        <div class="hidden text-left sm:block">

          <p class="text-sm font-semibold text-gray-900">
            {{ utilisateur.nom }}
          </p>

          <p class="text-xs text-gray-500">
            {{ utilisateur.role }}
          </p>

        </div>


        <!-- Chevron -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="hidden h-4 w-4 text-gray-400 transition-transform duration-200 sm:block"
          [class.rotate-180]="menuProfilOuvert"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 9l6 6 6-6"
          />
        </svg>

      </button>


      <!-- ================================================= -->
      <!-- MENU DÉROULANT PROFIL -->
      <!-- ================================================= -->

      <div
        *ngIf="menuProfilOuvert"
        class="absolute right-0 top-14 z-50 w-72 overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-xl"
      >

        <!-- =============================================== -->
        <!-- INFORMATIONS UTILISATEUR -->
        <!-- =============================================== -->

        <div class="border-b border-gray-100 bg-gray-50 px-4 py-4">

          <div class="flex items-center gap-3">

            <!-- Avatar -->
            <div
              class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-green-100 text-sm font-bold text-green-700"
            >
              {{ utilisateur.initiales }}
            </div>


            <!-- Nom + rôle -->
            <div class="min-w-0">

              <p class="truncate text-sm font-bold text-gray-900">
                {{ utilisateur.nom }}
              </p>

              <p class="mt-0.5 text-xs text-gray-500">
                {{ utilisateur.role }}
              </p>

            </div>

          </div>

        </div>


        <!-- =============================================== -->
        <!-- ACTIONS -->
        <!-- =============================================== -->

        <div class="p-2">

          <!-- ============================================= -->
          <!-- MON PROFIL -->
          <!-- ============================================= -->

          <a
            routerLink="/dashboard/profil"
            (click)="menuProfilOuvert = false"
            class="flex w-full items-center gap-3 rounded-xl px-3 py-3 transition hover:bg-green-50"
          >

            <!-- Icône -->
            <div
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-green-50 text-green-600"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 19a6 6 0 00-12 0m6-8a4 4 0 100-8 4 4 0 000 8zm9-3v6m3-3h-6"
                />
              </svg>
            </div>


            <!-- Texte -->
            <div class="flex-1">

              <p class="text-sm font-medium text-gray-800">
                Mon profil
              </p>

              <p class="text-xs text-gray-400">
                Consulter mes informations
              </p>

            </div>


            <!-- Flèche -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 text-gray-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>

          </a>


          <!-- Séparateur -->
          <div class="my-1 border-t border-gray-100"></div>


          <!-- ============================================= -->
          <!-- DÉCONNEXION -->
          <!-- ============================================= -->

          <a
            routerLink="/connexion"
            (click)="menuProfilOuvert = false"
            class="flex w-full items-center gap-3 rounded-xl px-3 py-3 transition hover:bg-red-50"
          >

            <!-- Icône -->
            <div
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-red-50 text-red-600"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M10 17l5-5-5-5m5 5H3m10-8V3a1 1 0 011-1h5a2 2 0 012 2v16a2 2 0 01-2 2h-5a1 1 0 01-1-1v-1"
                />
              </svg>
            </div>


            <!-- Texte -->
            <div>

              <p class="text-sm font-medium text-red-600">
                Déconnexion
              </p>

              <p class="text-xs text-red-400">
                Quitter votre session
              </p>

            </div>

          </a>

        </div>

      </div>

    </div>

  </div>

</header>
